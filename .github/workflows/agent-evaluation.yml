# 说明：本工作流只使用固定测试数据 + 受控确定性 Mock 执行器 + 确定性验证器，
# 不会调用真实付费模型。请勿在此工作流中注入 DEEPSEEK_API_KEY 等生产密钥。

name: agent-evaluation

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-evaluation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  # 显式关闭真实付费 API：工作流不读取任何 secrets，也不应被配置为真实调用
  TRACEPILOT_ALLOW_REAL_API: "0"

jobs:
  quality-gate:
    name: Backend tests + Frontend build + Evaluation Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 1. Checkout 代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. 安装后端依赖
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. 初始化本地演示数据（sales 表；运行期 *.db 不入库，CI 需显式创建）
      - name: Initialize demo SQLite data
        run: python scripts/init_demo_db.py

      # 5. 术语防雷检查（禁用词规则见 docs/TERMINOLOGY.md）
      - name: Terminology guard
        run: python scripts/check_terminology.py

      # 6. 运行后端测试（确定性、无付费 API）
      - name: Run backend tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -q

      # 5. 设置 Node 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 6. 安装前端依赖
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 7. 运行前端构建
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 8-12. 加载固定评测集 → 确定性 Mock 评测 → 版本对比 → 回归检测 → 质量门禁
      # 退出码：0 PASS / WARN（可配置）、1 BLOCK、2 INCONCLUSIVE、3 执行异常
      - name: Run deterministic evaluation quality gate
        run: |
          python scripts/ci_quality_gate.py \
            --report-dir ci-reports/quality-gate \
            --ci-run-id "${{ github.run_id }}"

      # 13. 保存评测/门禁报告（即使门禁失败也保留证据）
      - name: Upload quality gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports-${{ github.run_id }}
          path: ci-reports/
          retention-days: 14
          if-no-files-found: warn

      # 14. 输出 CI 运行摘要（脚本在 GITHUB_STEP_SUMMARY 存在时已写入；此处兜底）
      - name: Publish CI summary
        if: always()
        run: |
          echo "## Agent Evaluation Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ci-reports/quality-gate/quality-gate-report.md ]; then
            cat ci-reports/quality-gate/quality-gate-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成门禁报告（请查看上方步骤日志）。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> 本工作流使用固定测试数据与确定性 Mock 执行器，不调用真实付费模型。" >> "$GITHUB_STEP_SUMMARY"

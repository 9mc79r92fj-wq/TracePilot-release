# 真实 DeepSeek API 冒烟测试（独立工作流，默认不触发）
#
# 为什么独立：
# - 真实调用会产生费用，普通 CI / PR 绝不调用付费接口；
# - 只有手动 workflow_dispatch 才会运行，且必须配置仓库 Secret `DEEPSEEK_API_KEY`；
# - 工作流内强制小预算（总调用上限 6），跑完输出报告 artifact。
#
# 不在 PR / push 上触发；fork 的 PR 也无法读取 Secret，因此不会产生费用。
name: real-api-smoke

on:
  workflow_dispatch:
    inputs:
      with_agent:
        description: "是否额外执行一次真实 Agent 任务（约 4 次模型调用）"
        type: boolean
        default: true
      max_calls:
        description: "本次允许消耗的上游调用数上限（1-6）"
        type: string
        default: "6"

permissions:
  contents: read

concurrency:
  group: real-api-smoke
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  # 真实调用必须显式开启；预算持久化到工作区文件，跑完随 artifact 一起归档
  TRACEPILOT_ALLOW_REAL_API: "1"
  TRACEPILOT_REAL_TOTAL_CALL_LIMIT: "6"
  TRACEPILOT_REAL_VISITOR_DAILY_LIMIT: "6"
  TRACEPILOT_REAL_BUDGET_PATH: "ci-reports/real-api-budget.json"
  DEEPSEEK_MODEL: "deepseek-flash"

jobs:
  smoke:
    name: Real DeepSeek API smoke (budget-capped)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard - secret is configured
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::缺少仓库 Secret DEEPSEEK_API_KEY，真实 API 冒烟测试无法运行（不会产生任何调用）。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Precheck (no paid calls)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/real_api_smoke.py --check-only

      - name: Run smoke (paid calls, capped)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ inputs.with_agent }}" = "true" ]; then
            python scripts/real_api_smoke.py \
              --yes --with-agent --max-calls "${{ inputs.max_calls }}"
          else
            python scripts/real_api_smoke.py \
              --yes --max-calls "${{ inputs.max_calls }}"
          fi

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-api-smoke-${{ github.run_id }}
          path: |
            data/v2_real_runs/
            ci-reports/
          retention-days: 14
          if-no-files-found: warn

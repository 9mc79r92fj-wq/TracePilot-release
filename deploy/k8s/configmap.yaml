# TracePilot · 非敏感运行配置
#
# 安全边界：ConfigMap 只放非敏感开关与路径；API Key / 管理员令牌等敏感信息
# 不入库、不进 ConfigMap，运行时仅通过 K8s Secret（secretKeyRef）注入。
# 公开演示模式下真实 DeepSeek 调用被代码层强制关闭（见 backend/app/services/）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracepilot-config
  namespace: tracepilot
  labels:
    app.kubernetes.io/name: tracepilot
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: tracepilot
data:
  # --- 运行档位与公开演示 ---
  # production：严格预算档（execution_config.py 的 production 限额）
  TRACEPILOT_ENV: "production"
  # 公开演示模式：即使误设 ALLOW_REAL_API=1 也强制禁用匿名真实 API 调用
  TRACEPILOT_PUBLIC_DEMO: "1"
  # 显式关闭真实 API 开关，kind 演示环境不产生任何付费调用
  TRACEPILOT_ALLOW_REAL_API: "0"

  # --- 单端口同源托管（/api + 前端 SPA）---
  TRACEPILOT_STATIC_DIR: "/app/frontend/dist"

  # --- 运行数据 ---
  # 默认清单使用 emptyDir（重启即丢）；启用 PVC 持久化见 pvc.yaml 与 README
  TRACEPILOT_DB_PATH: "/app/data/tracepilot.db"
  # 运行记录落盘开关；持久化目录存在时才有跨重启保留意义
  TRACEPILOT_PERSIST_AGENT_RUNS: "1"
  TRACEPILOT_PERSIST_EVAL_RUNS: "1"

  # --- 限流（进程内滑窗，单副本演示足够）---
  # kind 场景经 NodePort 直接暴露、无反向代理，因此不信任 X-Forwarded-For
  TRACEPILOT_RATE_LIMIT_ENABLED: "1"
  TRACEPILOT_RATE_LIMIT_GENERAL_PER_MINUTE: "120"
  TRACEPILOT_RATE_LIMIT_HEAVY_PER_MINUTE: "10"
  TRACEPILOT_TRUST_PROXY: "0"

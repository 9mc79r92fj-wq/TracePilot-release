# TracePilot · NodePort Service（kind：host 8080 -> node 30080 -> Pod 7860）
#
# selector 与 Deployment 的 Pod 模板 labels 完全一致，保证流量只命中本应用。
apiVersion: v1
kind: Service
metadata:
  name: tracepilot
  namespace: tracepilot
  labels:
    app.kubernetes.io/name: tracepilot
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tracepilot
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tracepilot
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tracepilot
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 7860
      nodePort: 30080
